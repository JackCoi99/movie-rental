<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="api-base-url" content="http://127.0.0.1:8000">
  <title>Ficha de película · Movie Rental</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/axios@1/dist/axios.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a href="index.html#catalogo" class="skip">Saltar al catálogo</a>

  <header class="header">
    <div class="shell nav">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">▶</span>
        Movie Rental
      </a>
      <nav aria-label="Navegación principal">
        <a href="index.html#catalogo">Catálogo</a>
        <a href="index.html#documentacion">Documentación</a>
        <button class="secondary cart-toggle" id="open-cart" type="button">
          Carrito <span id="cart-count">0</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="shell workspace" id="ficha">
    <h1 class="page-title">Ficha de película</h1>
    <p id="status" class="notice" role="status"></p>
    <p id="error" class="notice error" role="alert"></p>

    <section id="detail-view" class="panel" aria-labelledby="detail-title" hidden>
      <a class="button secondary" href="index.html#catalogo">Volver al catálogo</a>

      <div class="detail-layout">
        <div id="detail-poster" class="poster" aria-hidden="true"></div>

        <div>
          <h3 id="detail-title" tabindex="-1"></h3>
          <p id="detail-description"></p>
          <dl id="detail-data"></dl>

          <div class="actions">
            <button type="button" id="pay-movie" aria-controls="rental-form" aria-expanded="false">
              Pagar alquiler
            </button>
            <button type="button" class="secondary" id="cart-movie">Añadir al carrito</button>
            <button type="button" class="secondary" id="edit-movie">Editar película</button>
            <button type="button" class="danger" id="delete-movie">Eliminar película</button>
          </div>

          <form id="rental-form" aria-labelledby="rental-title" hidden>
            <h4 id="rental-title">Pago de prueba</h4>
            <p>Este formulario registra el alquiler. No realiza ningún cargo.</p>
            <p id="rental-help"></p>

            <div id="rental-controls" class="toolbar" hidden>
              <div>
                <label for="rental-user">Usuario</label>
                <select id="rental-user" required aria-describedby="rental-help"></select>
              </div>
              <button type="submit">Confirmar alquiler</button>
            </div>
          </form>
        </div>
      </div>
    </section>

    <section id="form-view" class="panel" aria-labelledby="form-title" hidden>
      <h3 id="form-title" tabindex="-1"></h3>

      <form id="movie-form">
        <div class="fields">
          <div>
            <label for="name">Título (obligatorio)</label>
            <input id="name" name="name" required>
          </div>
          <div>
            <label for="year">Año (obligatorio)</label>
            <input id="year" name="year" type="number" min="1" max="9999" required>
          </div>
          <div>
            <label for="director">Dirección (obligatorio)</label>
            <select id="director" name="director" required></select>
          </div>
          <div>
            <label for="available">Disponibilidad</label>
            <select id="available" name="available">
              <option value="true">Disponible</option>
              <option value="false">No disponible</option>
            </select>
          </div>
        </div>

        <label for="description">Sinopsis</label>
        <textarea id="description" name="description" rows="4"></textarea>

        <div class="fields relations">
          <fieldset>
            <legend>Reparto</legend>
            <div id="actors" class="choices"></div>
          </fieldset>
          <fieldset>
            <legend>Géneros</legend>
            <div id="genres" class="choices"></div>
          </fieldset>
        </div>

        <div class="actions">
          <button type="submit" id="save-movie">Guardar película</button>
          <button type="button" class="secondary" id="cancel-form">Cancelar</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="shell footer">Movie Rental</footer>

  <dialog id="cart-dialog" aria-labelledby="cart-title">
    <div class="section-head">
      <h2 id="cart-title">Carrito</h2>
      <form method="dialog">
        <button class="secondary">Cerrar</button>
      </form>
    </div>
    <ul id="cart-items"></ul>
  </dialog>
</body>
</html>
